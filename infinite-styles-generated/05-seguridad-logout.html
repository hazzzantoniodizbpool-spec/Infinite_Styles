<!doctype html><html lang="en-US" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seguridad & Cerrar Sesión (Haute Édition)"><style>:root{--surface:#131314;--surface-bright:#39393a;--on-surface:#e5e2e3;--primary:#f2ca50;--on-primary:#3c2f00;--primary-container:#d4af37;--secondary:#e1c46e;--on-secondary:#3c2f00;--tertiary:#f8c854;--on-tertiary:#3f2e00;--surface-container:#201f20;--surface-container-high:#2a2a2b;--surface-container-highest:#353436;--outline:#99907c;--outline-variant:#4d4635;--font-body:"Plus Jakarta Sans",sans-serif;--font-headline:"Syne",sans-serif;--font-label:"Space Grotesk",sans-serif;--rounded:8;}*{box-sizing:border-box}body{font-family:var(--font-body);background:var(--surface);color:var(--on-surface);margin:0;padding:24px}.logo{font-family:var(--font-headline);font-size:32px;color:var(--primary);margin-bottom:24px}.screen-title{font-family:var(--font-headline);font-size:24px;color:var(--primary);margin-bottom:16px}.card{background:var(--surface-container);border-radius:var(--rounded)px;padding:24px;margin:16px 0;border:1px solid var(--outline-variant)}.security-item{background:var(--surface-container-high);border-radius:var(--rounded)px;padding:20px;margin:16px 0;border-left:4px solid var(--primary)}.security-title{font-family:var(--font-headline);color:var(--primary);margin:0 0 12px;font-size:20px}.security-desc{color:#d0c5af;font-size:14px;margin:0 0 16px}.btn-danger{background:#ffb4ab;color:#690005;border:none;padding:12px 24px;border-radius:var(--rounded)px;font-family:var(--font-headline);font-size:16px;font-weight:500;cursor:pointer;width:100%;margin:16px 0;background:#ffb4ab;color:#690005}.btn-outline{border:2px solid var(--outline-variant);color:var(--on-surface-variant);background:transparent;padding:12px 24px;border-radius:var(--rounded)px;font-family:var(--font-headline);font-size:16px;font-weight:500;cursor:pointer;width:100%;margin:16px 0}</style></head><body><div class="logo">Infinite Styles</div><div class="screen-title">Seguridad & Cerrar Sesión</div><div class="card"><h2>Configuración de Seguridad</h2><div class="security-item"><h3 class="security-title">Autenticación de Dos Factores</h3><p class="security-desc">Agrega una capa extra de seguridad a tu cuenta requeriendo un código de verificación además de tu contraseña.</p></div><div class="security-item"><h3 class="security-title">Historial de Actividad</h3><p class="security-desc">Revisa los inicios de sesión recientes y las actividades en tu cuenta.</p></div><div class="security-item"><h3 class="security-title">Notificaciones por Email</h3><p class="security-desc">Recibe alertas por correo electrónico cuando se inicie sesión desde un nuevo dispositivo.</p></div></div><div class="card"><h2>Sesiones Activas</h2><p>Actualmente tienes 2 sesiones activas:</p><div style="background:var(--surface-container-high);border-radius:var(--rounded)px;padding:16px;margin:16px 0;"><strong>Este dispositivo</strong> - Chrome en Windows - Activa hace 2 horas</div><div style="background:var(--surface-container-high);border-radius:var(--rounded)px;padding:16px;margin:16px 0;"><strong>iPhone 13 Pro</strong> - Safari iOS - Activa hace 1 día</div></div><div class="card"><button class="btn-danger">Cerrar Sesión en Todos los Dispositivos</button><button class="btn-outline">Cerrar Sesión Solo Aquí</button></div></body></html>
