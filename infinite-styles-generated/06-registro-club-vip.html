<!doctype html><html lang="en-US" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registro & Club VIP (Haute Édition)"><style>:root{--surface:#131314;--surface-bright:#39393a;--on-surface:#e5e2e3;--primary:#f2ca50;--on-primary:#3c2f00;--primary-container:#d4af37;--secondary:#e1c46e;--on-secondary:#3c2f00;--tertiary:#f8c854;--on-tertiary:#3f2e00;--surface-container:#201f20;--surface-container-high:#2a2a2b;--surface-container-highest:#353436;--outline:#99907c;--outline-variant:#4d4635;--font-body:"Plus Jakarta Sans",sans-serif;--font-headline:"Syne",sans-serif;--font-label:"Space Grotesk",sans-serif;--rounded:8;}*{box-sizing:border-box}body{font-family:var(--font-body);background:var(--surface);color:var(--on-surface);margin:0;padding:24px}.logo{font-family:var(--font-headline);font-size:32px;color:var(--primary);margin-bottom:24px}.screen-title{font-family:var(--font-headline);font-size:24px;color:var(--primary);margin-bottom:16px}.card{background:var(--surface-container);border-radius:var(--rounded)px;padding:24px;margin:16px 0;border:1px solid var(--outline-variant)}.input-group{margin:16px 0}.input-label{display:block;margin-bottom:8px;color:var(--on-surface-variant);font-size:14px}.input-field{width:100%;padding:12px 16px;background:var(--surface-container-high);border:1px solid var(--outline-variant);border-radius:var(--rounded)px;color:var(--on-surface);font-size:16px}.input-field:focus{outline:none;border-color:var(--primary)}.radio-group{display:flex;gap:24px;margin:16px 0}.radio-item{display:flex;align-items:center;cursor:pointer}.radio-input{margin-right:8px}.radio-label{font-size:14px;color:var(--on-surface)}.checkbox-group{margin:16px 0;display:flex;align-items:center}.checkbox-input{margin-right:8px}.terms-link{color:var(--primary);text-decoration:none}.btn-submit{background:var(--primary);color:var(--on-primary);border:none;padding:14px 24px;border-radius:var(--rounded)px;font-family:var(--font-headline);font-size:16px;font-weight:500;cursor:pointer;width:100%;margin:24px 0}.btn-submit:disabled{background:var(--outline-variant);cursor:not-allowed}.success-message{background:#d1fae5;color:#065f46;padding:16px;border-radius:var(--rounded)px;margin:16px 0;display:none}</style></head><body><div class="logo">Infinite Styles</div><div class="screen-title">Registro & Club VIP</div><div class="card"><h2>Únete al Club Exclusive VIP</h2><p>Completa el formulario para acceder a beneficios exclusivos solo para miembros.</p><form id="registrationForm"><div class="input-group"><label class="input-label">Nombre Completo</label><input type="text" class="input-field" placeholder="Ej: Juan Pérez" required></div><div class="input-group"><label class="input-label">Email</label><input type="email" class="input-field" placeholder="ejemplo@correo.com" required></div><div class="input-group"><label class="input-label">Teléfono</label><input type="tel" class="input-field" placeholder="+1 234 567 8900" required></div><div class="input-group"><label class="input-label">Edad</label><input type="number" class="input-field" placeholder="25" min="18" max="99" required></div><div class="input-group"><label class="input-label">Membresia Deseada</label><div class="radio-group"><div class="radio-item"><input type="radio" id="platinum" name="tier" class="radio-input" checked><label for="platinum" class="radio-label">Platinum - $299</label></div><div class="radio-item"><input type="radio" id="gold" name="tier" class="radio-input"><label for="gold" class="radio-label">Gold - $199</label></div></div></div><div class="checkbox-group"><input type="checkbox" id="terms" class="checkbox-input" required><label for="terms" class="radio-label">Acepto los términos de servicio y la política de privacidad</label></div><button type="submit" class="btn-submit" id="submitBtn" disabled>Completar Registro</button></form><div class="success-message" id="successMessage">¡Registro exitoso! Revisa tu email para confirmación.</div></div></div><script>document.addEventListener("DOMContentLoaded", function() { const form = document.getElementById("registrationForm"); const submitBtn = document.getElementById("submitBtn"); const successMessage = document.getElementById("successMessage"); const termsCheckbox = document.getElementById("terms"); function updateSubmitButton() { submitBtn.disabled = !termsCheckbox.checked; }; termsCheckbox.addEventListener("change", updateSubmitButton); form.addEventListener("submit", function(e) { e.preventDefault(); successMessage.style.display = "block"; setTimeout(() => { successMessage.style.display = "none"; }, 5000); }); });</script></body></html>
